<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幕言 · AI 营销助手</title><link rel="stylesheet" href="/style.css?v=compact-actions-1"></head><body>
<aside class="history-sidebar"><a class="brand" href="/">◈ 幕言</a><a class="operations-link" href="/operations.html">▦ 发布与运营</a><button id="new" class="new-chat">＋ 新对话</button><a class="operations-link" href="/showcase.html">▷ 公开样片与对话</a><button id="film-library" class="ghost">▤ 历史视频</button><h2 class="nav-label">最近对话</h2><nav id="history" aria-label="对话历史"></nav></aside>
<main><header><div class="heading"><h1 id="project-title">新对话</h1></div><div class="header-actions"><a id="login-link" href="/operations.html" hidden>登录账号</a><span id="state" class="status">准备就绪</span><button id="browser-toggle" class="icon-button" title="查看浏览器与资料" aria-label="查看浏览器与资料" aria-expanded="false" aria-controls="preview">◎</button><button id="preview-toggle" class="icon-button" title="查看作品与方案" aria-label="查看作品与方案" aria-expanded="false" aria-controls="preview">▣<span id="work-badge" hidden></span></button></div></header>
<div class="workspace"><section class="conversation"><div id="intro"><div class="intro-mark">◈</div><h2>今天，想让什么被看见？</h2></div><div id="messages" aria-live="polite"></div><div id="research-status" class="research-status" hidden aria-live="polite"></div><div id="render-inline"></div><div id="chat-end"></div>
<div id="composer" class="composer"><div id="settings" hidden><div class="settings-grid"><label>发布平台<details class="platform-picker"><summary id="platform-summary">选择平台</summary><div id="platform-options"><label><input type="checkbox" aria-label="抖音" value="douyin">抖音</label><label><input type="checkbox" aria-label="YouTube" value="youtube">YouTube</label><label><input type="checkbox" aria-label="YouTube Shorts" value="shorts">YouTube Shorts</label><label><input type="checkbox" aria-label="小红书" value="xiaohongshu">小红书</label><label><input type="checkbox" aria-label="哔哩哔哩" value="bilibili">哔哩哔哩</label><label><input type="checkbox" aria-label="Instagram" value="instagram">Instagram</label></div></details><select id="platform" hidden><option value="youtube">YouTube</option><option value="douyin">抖音</option><option value="shorts">Shorts</option><option value="xiaohongshu">小红书</option><option value="bilibili">B站</option><option value="instagram">Instagram</option></select></label><label>画幅<select id="aspect-ratio"><option value="16:9">横版 16:9</option><option value="9:16">竖版 9:16</option><option value="1:1">方形 1:1</option></select></label><label>时长（秒）<input id="project-duration" type="number" min="15" max="60" step="1" value="30" required></label><label>音色<select id="voice"><option value="auto">自动推荐</option><option value="Ethan">温暖男声</option><option value="Cherry">亲切女声</option><option value="Serena">温柔女声</option><option value="local">本地配音 · 免费</option></select></label><label>配乐<select id="music"><option value="auto">自动推荐</option><option value="house_vibez">现代产品 · House</option><option value="cat_walk">时尚活力 · House</option><option value="hiphop">年轻叙事 · Hip-hop</option><option value="urban">沉稳力量 · Urban</option><option value="cipher">科技电子 · Cipher</option><option value="ambient">克制氛围</option></select></label><label>剪辑节奏<select id="pace"><option value="fast">轻快 · 短镜头</option><option value="balanced">舒缓 · 叙事</option></select></label></div><div class="checks"><label><input id="narration-enabled" type="checkbox" checked>配音</label><label><input id="video-budget" type="checkbox">少量 AI 动态镜头（额外费用）</label><label><input id="bgm" type="checkbox" checked>加入配乐</label></div><div class="audio-tools"><button type="button" id="voice-preview" class="ghost">▶ 试听音色</button><button type="button" id="music-preview" class="ghost">♫ 试听配乐</button><button type="button" id="audio-library" class="ghost">音色与配乐库</button></div><audio id="audio-preview" controls hidden></audio></div>
<div id="attachment-list" class="attachment-list"></div><input id="file-input" type="file" accept=".txt,.md,.csv,.json,.pdf,.docx" multiple hidden><textarea id="message" rows="2" maxlength="20000" aria-label="发送消息" placeholder="发送消息，或上传资料"></textarea><div class="composer-bottom"><div class="composer-tools"><button id="upload-button" class="icon-button upload-button" title="上传资料" aria-label="上传资料"><span class="upload-plus" aria-hidden="true"></span></button><label class="network-chip"><input id="network" type="checkbox" checked>◎ 联网搜索</label><button id="settings-toggle" class="ghost" aria-expanded="false" aria-controls="settings">⚙ 创作设置</button></div><button id="send" class="send-button" aria-label="发送消息">↑</button></div><p id="error" role="alert"></p></div></section></div>
<div id="drawer-backdrop" hidden></div><section id="preview" class="preview" hidden aria-label="作品与资料侧栏"><div class="preview-heading"><h2 id="drawer-title">作品与方案</h2><button id="preview-close" class="icon-button" aria-label="关闭侧栏">×</button></div><div class="drawer-tabs"><button id="tab-work" class="selected">作品与方案</button><button id="tab-browser">浏览器与资料</button></div><div id="work-panel"><span id="film-duration"></span><div id="result"></div><section id="generation" class="generation" hidden aria-live="polite"><div class="progress-heading"><strong id="progress-stage">准备中</strong><span id="progress-percent"></span></div><progress id="progress" max="100" value="0"></progress><div class="progress-footer"><span id="progress-detail"></span><span id="eta"></span></div><p></p></section><div id="render-actions"></div><details id="plan-details" class="plan-details"><summary><span>创作方案</span><span id="plan-summary">等待方案</span><span>⌄</span></summary><div id="plan"></div></details><details class="activity"><summary>制作记录</summary><div id="events"></div></details></div><div id="browser-panel" hidden><p class="muted">读取公开网页</p><div class="browser-address"><input id="browser-url" type="url" placeholder="https://要阅读的网页" aria-label="要阅读的网页"><button id="read-url" class="primary">读取</button></div><div id="browser-current"></div><h3>参考资料</h3><div id="sources"></div></div></section><div id="toast" role="status" hidden></div><dialog id="clarify-dialog" aria-labelledby="clarify-title"><form id="clarify-form"><div class="clarify-heading"><h2 id="clarify-title">补充信息</h2><button type="button" id="clarify-close" class="icon-button" aria-label="关闭补充信息">×</button></div><div id="clarify-fields"></div><div class="clarify-footer"><button type="button" id="clarify-skip" class="ghost">采用推荐项</button><button type="submit" id="clarify-submit" class="primary">生成最终方案</button></div><p id="clarify-error" role="alert"></p></form></dialog><dialog id="audio-dialog" aria-labelledby="audio-dialog-title"><div class="clarify-heading"><h2 id="audio-dialog-title">音色与配乐库</h2><button id="audio-close" class="icon-button" aria-label="关闭音频库">×</button></div><div class="audio-tabs"><button id="library-voices" class="ghost">音色</button><button id="library-music" class="ghost">配乐</button><button id="library-rights" class="ghost">授权说明</button></div><div id="audio-library-content"></div></dialog><dialog id="workspace-dialog"><div class="clarify-heading"><h2 id="workspace-dialog-title">历史视频</h2><button id="workspace-close" class="icon-button" aria-label="关闭窗口">×</button></div><div id="workspace-content"></div></dialog></main><script src="/app.js?v=dynamic-shot-4"></script></body></html>
