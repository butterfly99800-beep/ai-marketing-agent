<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内容发布 · 幕言</title><link rel="stylesheet" href="/operations.css"><link rel="stylesheet" href="/publisher.css"></head><body>
<aside><a class="brand" href="/publisher.html">◈ 幕言</a><nav><a class="selected" href="/publisher.html">↗ 内容发布</a><a href="/operations.html">◎ 账号、数据与评论</a><a href="/studio">创作工作室</a></nav><div class="aside-bottom" id="identity">未登录</div></aside>
<main><header><div><div class="eyebrow">PUBLISH STUDIO</div><h1>让作品到达更多地方</h1></div><a class="secondary" href="/operations.html">管理账号</a></header><div id="feedback" role="status" hidden></div>
<section id="login" class="card" hidden><h2>登录发布工作台</h2><form id="login-form"><label>账号<input id="name" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">登录</button></form></section>
<div id="studio" hidden><div class="publish-grid"><section class="card"><h2>1. 作品</h2><label class="upload-target">＋ 上传 MP4 成品<input id="upload" type="file" accept="video/mp4,.mp4"></label><progress id="upload-progress" max="100" value="0" hidden></progress><label>作品库<select id="work"><option value="">选择作品</option></select></label><video id="preview" controls preload="metadata" hidden></video><label>产品、受众和内容介绍（选填）<textarea id="brief" rows="4" maxlength="12000" placeholder="例如：国际货代查询平台，面向欧洲进口商，展示海运查询和报价比较，官网…"></textarea></label><label>文案语言<select id="language"><option value="English">English</option><option value="简体中文">简体中文</option><option value="Español">Español</option><option value="日本語">日本語</option><option value="Deutsch">Deutsch</option><option value="Français">Français</option><option value="Português">Português</option><option value="العربية">العربية</option></select></label><h2>2. 平台</h2><div id="platforms" class="platforms"></div><button id="generate" class="primary">生成各平台发布文案</button></section>
<section class="card"><div class="section-heading"><h2>3. 文案与排程</h2><button id="export" class="secondary" disabled>导出文案</button></div><label>历史文案<select id="draft-history"><option value="">选择已保存文案</option></select></label><div id="copies" class="empty">选择作品和平台后生成文案</div><details id="schedule"><summary>设置发布时间</summary><label>YouTube 频道<select id="channel"><option value="">未选择</option></select></label><div class="form-grid"><label>起始时间<input id="start" type="datetime-local" required></label><label>不同作品的间隔<select id="interval"><option value="6">每 6 小时</option><option value="12">每 12 小时</option><option value="24">每 24 小时</option><option value="48">每 48 小时</option></select></label></div><p class="muted" id="timezone"></p><p class="muted">不同作品依次排队，同一作品可跨平台发布。间隔不代表免限流；未授权平台保留为待接入任务。</p><label>YouTube 可见性<select id="privacy"><option value="private">私密</option><option value="unlisted">不公开</option><option value="public">公开</option></select></label><label>受众<select id="kids"><option value="">请选择</option><option value="no">不是专为儿童制作</option><option value="yes">专为儿童制作</option></select></label><label class="check"><input type="checkbox" id="synthetic">包含需要声明的合成或 AI 内容</label><label class="check"><input type="checkbox" id="confirm">我已核对文案、素材权利、账号、受众和时间，确认按排程发布。</label><button id="enqueue" class="primary" disabled>保存文案并加入排程</button></details></section></div>
<section class="card"><div class="section-heading"><h2>发布队列</h2><button id="refresh" class="secondary">刷新</button></div><div id="queue" class="empty">暂无任务</div></section></div></main><script src="/publisher.js"></script></body></html>
